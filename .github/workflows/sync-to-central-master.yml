
name: Sync subtree → Central (master)

on:
  push:
    branches: [ main ]

concurrency:
  group: subtree-sync-master
  cancel-in-progress: true

permissions:
  contents: write  # Needed for PR creation

env:
  CENTRAL_REPO: DEFRA/sps-apim-gateway
  BASE_BRANCH: master

  TEAM_REMOTE_NAME: team-a
  TEAM_REPO_URL: pradhapdefra/sps-apim-gateway-team-a
  TEAM_BRANCH: main

  INTERNAL_PREFIX: internal/dev/apis/address-lookup-v10
  EXTERNAL_PREFIX: external/dev/apis/address-lookup-v10

  TEAM_WINS_ON_CONFLICT: "true"

jobs:
  prepare-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (team repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start SSH agent & load central deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CENTRAL_SYNC_SSH_KEY }}

      - name: Install GitHub CLI
        run: sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Configure Git identity
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Clone central repo and prepare PR branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -x

          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "=== Clone central repo ==="
          git clone --depth=50 "git@github.com:${CENTRAL_REPO}.git" central-repo
          cd central-repo

          echo "=== Checkout base branch ==="
          git fetch origin "${BASE_BRANCH}" --depth=50
          git checkout -B "${BASE_BRANCH}" FETCH_HEAD

          echo "=== Add team remote and fetch ==="
          git remote add "${TEAM_REMOTE_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${TEAM_REPO_URL}.git" \
            || git remote set-url "${TEAM_REMOTE_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${TEAM_REPO_URL}.git"
          git fetch "${TEAM_REMOTE_NAME}" "${TEAM_BRANCH}"

          FOLDERS=("internal" "external")
          CHANGES=false

          for FOLDER in "${FOLDERS[@]}"; do
            if git ls-tree -r --name-only "refs/remotes/${TEAM_REMOTE_NAME}/${TEAM_BRANCH}" | grep -q "^${FOLDER}/"; then
              echo "Folder '${FOLDER}' exists. Syncing..."
              git checkout -B __team_branch__ "refs/remotes/${TEAM_REMOTE_NAME}/${TEAM_BRANCH}"
              SPLIT_SHA=$(git subtree split -P "${FOLDER}")
              git checkout "${BASE_BRANCH}"

              if [ -z "${SPLIT_SHA}" ]; then
                echo "ERROR: subtree split produced no commit for ${FOLDER}. Skipping..."
                continue
              fi

              TARGET_PREFIX=$([ "${FOLDER}" = "internal" ] && echo "${INTERNAL_PREFIX}" || echo "${EXTERNAL_PREFIX}")
              CUSTOM_MESSAGE="subtree: merge ${FOLDER} → ${TARGET_PREFIX} | Source: ${TEAM_REMOTE_NAME}/${TEAM_BRANCH} | Timestamp: ${TIMESTAMP} | Actor: ${GITHUB_ACTOR}"

              echo "=== Create PR branch ==="
              PR_BRANCH="pr-subtree/${TEAM_REMOTE_NAME}/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
              git checkout -b "${PR_BRANCH}"

              echo "=== Attempt subtree merge ==="
              EXTRA=$([ "${TEAM_WINS_ON_CONFLICT}" = "true" ] && echo "-X theirs" || echo "")
              set +e
              git merge -s subtree -Xsubtree="${TARGET_PREFIX}" ${EXTRA} "${SPLIT_SHA}" \
                --allow-unrelated-histories -m "${CUSTOM_MESSAGE}"
              MERGE_RC=$?
              set -e

              if [ $MERGE_RC -ne 0 ]; then
                echo "Merge failed. Bootstrapping subtree..."
                git merge --abort || git reset --merge || git reset --hard
                git merge -s ours --no-commit --allow-unrelated-histories "${SPLIT_SHA}"
                git read-tree --prefix="${TARGET_PREFIX}/" -u "${SPLIT_SHA}"
                git commit -m "${CUSTOM_MESSAGE}"
              fi

              CHANGES=true
            else
              echo "Folder '${FOLDER}' not found. Skipping..."
            fi
          done

          if [ "${CHANGES}" = "false" ]; then
            echo "No changes detected. Exiting."
            exit 0
          fi

          echo "=== Push PR branch ==="
          git push origin "${PR_BRANCH}" || {
            echo "Branch name collision, retrying..."
            PR_BRANCH="${PR_BRANCH}-$(date +%s)"
            git branch -m "${PR_BRANCH}"
            git push origin "${PR_BRANCH}"
          }

          echo "=== Create Pull Request ==="
          gh pr create --title "${CUSTOM_MESSAGE}" --body "Automated subtree sync for ${TEAM_REMOTE_NAME}" --base "${BASE_BRANCH}" --head "${PR_BRANCH}"
