
name: Submit Client ID to Central KV Config
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment (for audit/tracking only)"
        type: choice
        options: [dev, test, prod]
        required: true
      name:
        description: "Secret Name (KV key name). Allowed: A-Z a-z 0-9 _ . : -"
        required: true
      value:
        description: "Client ID (value)"
        required: true

jobs:
  forward-to-private:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Mask sensitive value in logs
        run: echo "::add-mask::${{ github.event.inputs.value }}"

      - name: Validate inputs
        uses: actions/github-script@v7
        with:
          script: |
            const env = core.getInput('env');
            const name = core.getInput('name');
            const value = core.getInput('value');

            const isEnv  = e => ['dev','test','prod'].includes((e||'').toLowerCase());
            const isName = s => /^[A-Za-z0-9_.:-]{3,128}$/.test(s||'');

            if (!isEnv(env))  core.setFailed('Invalid env (dev|test|prod)');
            if (!isName(name)) core.setFailed('Invalid name (allowed A-Za-z0-9_.:-, 3-128 chars)');
            if (!value || value.length < 3) core.setFailed('Invalid value');

      - name: Mint GitHub App installation token (for private repo)
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
          installation_id: ${{ secrets.PRIVATE_REPO_INSTALLATION_ID }}

      - name: Dispatch event to DEFRA/sps-apim-gateway (private)
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'DEFRA',
              repo:  'sps-apim-gateway',
              event_type: 'submit-client-id',
              client_payload: {
                env:   core.getInput('env'),
                name:  core.getInput('name'),
                value: core.getInput('value'),
                sourceRepo: `${context.repo.owner}/${context.repo.repo}`,
                sourceRunId: context.runId,
                sourceWorkflow: context.workflow
              }
            });

