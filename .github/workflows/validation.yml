
name: Validate APIM Structure & Carbon Metrics

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  validate-apim-structure:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------------------------
      # 1) APIM Structure Validator
      # ---------------------------
      - name: Run APIM Structure validation (capture output)
        id: validate_structure
        shell: pwsh
        run: |
          # Run and capture stdout/stderr into a single stream
          $cmd = {
            pwsh -File "${{ github.workspace }}/scripts/Validate-APIMStructure.ps1" `
              -Journey both `
              -Environment base `
              -FailOnError `
              -EnforceUpperSnakeCaseDisplayName
          }
          $structOut = & $cmd *>&1
          $structExit = $LASTEXITCODE

          # Expose status + exit code
          $structResult = if ($structExit -eq 0) { '✔️ Passed' } else { '❌ Failed' }
          "result=$structResult"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exit_code=$structExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Expose the full console text (multiline output)
          "console<<STRUCT_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $structOut | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "STRUCT_EOF"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # -------------------------------
      # 2) APIM Policy Rules Validator 
      # -------------------------------
      - name: Run APIM Policy Rules validation (capture output)
        id: validate_policies
        shell: pwsh
        run: |
          # Run your Policy Rules validator and capture output
          $cmd = {
            pwsh -File "${{ github.workspace }}/scripts/Validate-APIMPolicyRules.ps1" `
              -RootPath . `
              -Journey both `
              -Environments base,dev,pre,tst `
              -ApiName * `
              -FailOnError `
              -SuppressQuoteLint
          }
          $policyOut  = & $cmd *>&1
          $policyExit = $LASTEXITCODE

          $policyResult = if ($policyExit -eq 0) { '✔️ Passed' } else { '❌ Failed' }
          "result=$policyResult"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exit_code=$policyExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "console<<POLICY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $policyOut | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "POLICY_EOF"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------------------------------------------------
      # 3) Aggregate + Write Detailed Summary (Actions UI)
      # ---------------------------------------------------
      - name: Aggregate validation results and write Job Summary
        id: aggregate
        shell: pwsh
        run: |
          $structCode  = [int]"${{ steps.validate_structure.outputs.exit_code }}"
          $policyCode  = [int]"${{ steps.validate_policies.outputs.exit_code }}"
          $structRes   = "${{ steps.validate_structure.outputs.result }}"
          $policyRes   = "${{ steps.validate_policies.outputs.result }}"

          # Get raw console outputs (already emitted via GITHUB_OUTPUT)
          $structLog = @'
${{ steps.validate_structure.outputs.console }}
'@
          $policyLog = @'
${{ steps.validate_policies.outputs.console }}
'@

          $finalExit = if (($structCode -ne 0) -or ($policyCode -ne 0)) { 1 } else { 0 }

          # IMPORTANT: Here-string must open at column 0 and close at column 0
          $summaryMd = @"
# 🔎 Validation Results

* **Structure**: $structRes (exit=$structCode)
* **Policies**:  $policyRes (exit=$policyCode)

<details>
<summary><strong>📁<summary><strong>📁 Structure validation – detailed output</strong></summary>

```text
