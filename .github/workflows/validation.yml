name: Validate APIM Structure & Carbon Metrics

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  validate-apim-structure:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ---------------------------
      # 1) APIM Structure Validator
      # ---------------------------
      - name: Run APIM Structure validation (capture output)
        id: validate_structure
        shell: pwsh
        run: |
          # Run and capture stdout/stderr into a single stream
          $cmd = {
            pwsh -File "${{ github.workspace }}/scripts/Validate-APIMStructure.ps1" `
              -Journey both `
              -Environment base `
              -FailOnError `
              -EnforceUpperSnakeCaseDisplayName
          }
          $structOut = & $cmd *>&1
          $structExit = $LASTEXITCODE

          # Expose status + exit code
          $structResult = if ($structExit -eq 0) { '✔️ Passed' } else { '❌ Failed' }
          "result=$structResult"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exit_code=$structExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Expose the full console text (multiline output)
          "console<<STRUCT_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $structOut | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "STRUCT_EOF"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # -------------------------------------
      # 2) APIM Policy Rules Validator (NEW)
      # -------------------------------------
      - name: Run APIM Policy Rules validation (capture output)
        id: validate_policies
        shell: pwsh
        run: |
          # Run your Policy Rules validator and capture output
          $cmd = {
            pwsh -File "${{ github.workspace }}/scripts/Validate-APIMPolicyRules.ps1" `
              -RootPath . `
              -Journey both `
              -Environments base,dev,pre,tst `
              -ApiName * `
              -FailOnError `
              -SuppressQuoteLint
          }
          $policyOut  = & $cmd *>&1
          $policyExit = $LASTEXITCODE

          $policyResult = if ($policyExit -eq 0) { '✔️ Passed' } else { '❌ Failed' }
          "result=$policyResult"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exit_code=$policyExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "console<<POLICY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $policyOut | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "POLICY_EOF"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------------------------------------------------
      # 3) Aggregate + Write Detailed Summary (Actions UI)
      # ---------------------------------------------------
      - name: Aggregate validation results and write Job Summary
        id: aggregate
        shell: pwsh
        run: |
          $structCode  = [int]"${{ steps.validate_structure.outputs.exit_code }}"
          $policyCode  = [int]"${{ steps.validate_policies.outputs.exit_code }}"
          $structRes   = "${{ steps.validate_structure.outputs.result }}"
          $policyRes   = "${{ steps.validate_policies.outputs.result }}"

          # Get raw console outputs (already emitted via GITHUB_OUTPUT)
          $structLog = @'
${{ steps.validate_structure.outputs.console }}
'@
          $policyLog = @'
${{ steps.validate_policies.outputs.console }}
'@

          $finalExit = if (($structCode -ne 0) -or ($policyCode -ne 0)) { 1 } else { 0 }

          # IMPORTANT: Here-string must open at column 0 and close at column 0
          $summaryMd = @"
# 🔎 Validation Results

* **Structure**: $structRes (exit=$structCode)
* **Policies**:  $policyRes (exit=$policyCode)

<details>
<summary><strong>📁 Structure validation – detailed output</strong></summary>

```text
$structLog
```
</details>

<details>
<summary><strong>🛡️ Policy rules validation – detailed output</strong></summary>

```text
$policyLog
```
</details>
"@

          # Write to the Actions "Summary" tab (single write)
          $summaryMd | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # Expose compact one-liner for PR comment header
          $compact = "Structure: $structRes (exit=$structCode) | Policies: $policyRes (exit=$policyCode)"
          "compact=$compact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "final_exit=$finalExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # -----------------------------
      # 4) Carbon Intensity (as-is)
      # -----------------------------
      - name: Fetch GB Grid Carbon Intensity (now)
        id: ci
        shell: pwsh
        run: |
          try {
            $now = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mmZ")
            $url = "https://api.carbonintensity.org.uk/intensity/$now"
            $resp = Invoke-RestMethod -Uri $url -Method GET -ErrorAction Stop

            # Prefer 'actual', fallback to 'forecast'
            $ci = $resp.data[0].intensity.actual
            if (-not $ci) { $ci = $resp.data[0].intensity.forecast }
            $index = $resp.data[0].intensity.index
            if (-not $index) { $index = 'unknown' }

            "ci_now=$ci"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ci_index=$index" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ci_source=https://api.carbonintensity.org.uk/intensity/$now" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          catch {
            # Graceful fallback to a conservative default if API fails
            "ci_now=475"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ci_index=fallback" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "ci_source=(fallback default 475 gCO2/kWh)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::warning::Carbon Intensity API unavailable; using default 475 gCO2/kWh."
          }

      - name: Calculate Carbon Metrics (SCI Formula)
        id: carbon
        shell: pwsh
        run: |
          # ---------- Measurements / proxies ----------
          $CPUTimeSec = (Get-Process | Measure-Object CPU -Sum).Sum
          $RAMMB = (Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize / 1024
          $GPUName = (Get-CimInstance Win32_VideoController).Name
          $GPUStatus = (Get-CimInstance Win32_VideoController).Status

          # ---------- Approx energy model (proxy) ----------
          $EnergyKWh = [math]::Round(($CPUTimeSec * 0.0000003) + ($RAMMB * 0.0000001), 6)

          # ---------- Carbon intensity from live GB grid ----------
          $CarbonIntensity = [double]"${{ steps.ci.outputs.ci_now }}"
          $CIIndex = "${{ steps.ci.outputs.ci_index }}"
          $CISource = "${{ steps.ci.outputs.ci_source }}"

          # ---------- SCI operational term: O = E × I ----------
          $Emissions = [math]::Round($EnergyKWh * $CarbonIntensity, 2)   # g CO2 per run

          # ---------- Business impact (illustrative calc) ----------
          $AnnualImpact = [math]::Round(($Emissions * 10000 * 365) / 1000, 2)   # kg CO2 (10k runs/day)
          $CostEstimate = [math]::Round($EnergyKWh * 0.15, 4)                   # £ assuming £0.15/kWh

          # ---------- Remediation guidance ----------
          $remediation = ""
          if ($Emissions -ge 100) {
            $remediation += "- Profile & optimize hotspots (tests/build steps); reduce CPU time.`n"
            $remediation += "- Cache dependencies and artifacts more aggressively.`n"
            $remediation += "- Consider running non-urgent jobs in lower-CI windows (carbon-aware scheduling).`n"
          }
          elseif ($Emissions -ge 50) {
            $remediation += "- Tweak parallelism & memory limits; avoid over-provisioning.`n"
            $remediation += "- Carbon-aware rerun may reduce O without code changes.`n"
          }
          else {
            $remediation += "- No remediation needed.`n"
          }

          # ---------- Build PR report ----------
          $report = @"
          ## 🔎 Validation Summary (executive)
          * Structure:  ${{ steps.validate_structure.outputs.result }} (exit=${{ steps.validate_structure.outputs.exit_code }})
          * Policies:   ${{ steps.validate_policies.outputs.result }} (exit=${{ steps.validate_policies.outputs.exit_code }})

          ## 🌱 Carbon Metrics Report (SCI operational)
          * Energy (E): $EnergyKWh kWh
          * Carbon Intensity (I): $CarbonIntensity gCO₂/kWh _(GB grid; index: $CIIndex)_
          * Emissions (O = E × I): $Emissions g/run
          * Source: $CISource

          ### 📊 Business Impact
          * Projected Annual Impact: ~${AnnualImpact} kg CO₂ (10k runs/day)
          * Cost Estimate: £$CostEstimate/year
          * Target: <10 g/run  |  Warn ≥ 50 g  |  Fail ≥ 100 g

          ### 🔧 Remediation Suggestions
          $remediation
          "@

          # Expose outputs
          "report<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          $report | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "emissions=$Emissions"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "energy_kwh=$EnergyKWh" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Post Report to PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # 🔎 Validation Results (executive)
            * **Structure**:  ${{ steps.validate_structure.outputs.result }} (exit=${{ steps.validate_structure.outputs.exit_code }})
            * **Policies**:   ${{ steps.validate_policies.outputs.result }} (exit=${{ steps.validate_policies.outputs.exit_code }})

            <details>
            <summary><strong>📁 Structure validation – details</strong></summary>

            ```text
            ${{ steps.validate_structure.outputs.console }}
            ```
            </details>

            <details>
            <summary><strong>🛡️ Policy rules validation – details</strong></summary>

            ```text
            ${{ steps.validate_policies.outputs.console }}
            ```
            </details>

            ---
            ${{ steps.carbon.outputs.report }}

      - name: Add sustainability-warning label
        if: ${{ steps.carbon.outputs.emissions > 50 && github.event_name == 'pull_request' }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: sustainability-warning

      - name: Fail if any validation failed
        if: ${{ steps.aggregate.outputs.final_exit != '0' }}
        shell: pwsh
        run: |
          Write-Host "One or more validations failed. final_exit=${{ steps.aggregate.outputs.final_exit }}"
          exit 1
